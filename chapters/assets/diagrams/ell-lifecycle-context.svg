<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Where the Experience Learning Layer sits in the chat lifecycle</title>
  <desc id="desc">Chat and experience sources flow through capture and ordinary memory into the highlighted Experience Learning Layer. Applications use governed intuition packets, outcomes flow back into learning, and the surrounding product layers are outside the first confirmatory study.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8995A5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#3F2F73" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#FBFCFE"/>

  <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7B8796" letter-spacing="1.2">COMPLETE EXPERIENCE LIFECYCLE</text>
  <text x="1164" y="42" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#7B8796">Grey = surrounding product context · Purple = first-study research focus</text>

  <rect x="24" y="68" width="644" height="252" rx="22" fill="#F3F5F7" stroke="#D7DDE5" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="44" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8893A1" letter-spacing="0.8">UPSTREAM CONTEXT · OUTSIDE THE FIRST CONFIRMATORY STUDY</text>

  <rect x="684" y="68" width="260" height="252" rx="22" fill="#F5F1FF" stroke="#8B74C9" stroke-width="2"/>
  <text x="704" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6247A6" letter-spacing="0.8">ELL RESEARCH FOCUS</text>

  <rect x="960" y="68" width="216" height="252" rx="22" fill="#F3F5F7" stroke="#D7DDE5" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="980" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8893A1" letter-spacing="0.8">USE + FEEDBACK</text>

  <line x1="184" y1="201" x2="218" y2="201" stroke="#8995A5" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="201" x2="434" y2="201" stroke="#8995A5" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="650" y1="201" x2="700" y2="201" stroke="#8995A5" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="928" y1="201" x2="978" y2="201" stroke="#8995A5" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="42" y="130" width="142" height="142" rx="18" fill="#E9EDF1" stroke="#BFC8D2" stroke-width="1.5"/>
  <text x="113" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#46515F">1 · Chat + sources</text>
  <text x="113" y="201" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">conversation</text>
  <text x="113" y="221" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">tools · documents</text>
  <text x="113" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">recordings · events</text>

  <rect x="218" y="130" width="182" height="142" rx="18" fill="#E9EDF1" stroke="#BFC8D2" stroke-width="1.5"/>
  <text x="309" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#46515F">2 · Input + capture</text>
  <text x="309" y="201" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">consent · normalise</text>
  <text x="309" y="221" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">source artifacts</text>
  <text x="309" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">events → episodes</text>

  <rect x="434" y="130" width="216" height="142" rx="18" fill="#E9EDF1" stroke="#BFC8D2" stroke-width="1.5"/>
  <text x="542" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#46515F">3 · Memory layer</text>
  <text x="542" y="201" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">store · search · retrieve</text>
  <text x="542" y="221" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">summaries · associations</text>
  <text x="542" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">replaceable projections</text>

  <rect x="700" y="118" width="228" height="166" rx="20" fill="#EEE8FF" stroke="#765CB9" stroke-width="2" filter="url(#shadow)"/>
  <text x="814" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#34245F">4 · Experience Learning</text>
  <text x="814" y="183" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#34245F">Layer</text>
  <text x="814" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#59468C">reflect · test · consolidate</text>
  <text x="814" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#59468C">scope · apply · revise</text>
  <text x="814" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#765CB9">EVIDENCE-GOVERNED CONCEPTS</text>

  <rect x="978" y="118" width="180" height="92" rx="18" fill="#E9EDF1" stroke="#BFC8D2" stroke-width="1.5"/>
  <text x="1068" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#46515F">5 · Application</text>
  <text x="1068" y="181" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">response · action · decision</text>

  <rect x="978" y="228" width="180" height="74" rx="18" fill="#E9EDF1" stroke="#BFC8D2" stroke-width="1.5"/>
  <text x="1068" y="257" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#46515F">6 · Outcome</text>
  <text x="1068" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#687482">success · correction · change</text>

  <line x1="1068" y1="210" x2="1068" y2="226" stroke="#8995A5" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 978 265 C 934 350, 858 358, 814 286" fill="none" stroke="#765CB9" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="906" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#765CB9">OUTCOME FEEDBACK REVISES LEARNING</text>

  <rect x="42" y="384" width="1116" height="134" rx="20" fill="#FFFFFF" stroke="#D7DDE5" stroke-width="1.5"/>
  <text x="66" y="418" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#273142">THE KEY BOUNDARY</text>
  <text x="66" y="449" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#4E5A68">Memory returns past evidence. ELL asks what can responsibly be learned from it.</text>
  <text x="66" y="478" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#687482">The first study controls chat, capture, storage, and application conditions so it can isolate whether governed concept formation adds measurable value.</text>
  <text x="66" y="499" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#687482">Graphs, vector indexes, hosted memory, product clients, and connectors may be added later—but remain replaceable and non-canonical.</text>
</svg>
