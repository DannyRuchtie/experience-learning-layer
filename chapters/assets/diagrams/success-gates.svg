<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">ELL confirmatory decision path</title>
<desc id="desc">The strongest eligible baseline and ELL-Core receive matched experience streams and are evaluated on sealed transfer tasks. ELL is supported only when transfer, safety, evidence, adaptation, cost, governance, and replication gates all pass.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98AA"/></marker>
</defs>
<rect width="100%" height="100%" rx="24" fill="#FBFCFE"/>

<rect x="32" y="42" width="210" height="82" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="137" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Matched experience stream</text>
<text x="137" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">same evidence · model · budget</text>

<line x1="242" y1="83" x2="307" y2="83" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="274" y1="83" x2="274" y2="188" stroke="#8A98AA" stroke-width="2.2"/>
<line x1="274" y1="188" x2="307" y2="188" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="308" y="42" width="224" height="82" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="420" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Strongest eligible baseline</text>
<text x="420" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">selected on development data</text>

<rect x="308" y="147" width="224" height="82" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="420" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">ELL-Core</text>
<text x="420" y="203" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">governed concepts + evidence</text>

<line x1="532" y1="83" x2="608" y2="118" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="532" y1="188" x2="608" y2="153" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="610" y="83" width="318" height="105" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="769" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#162033">Sealed transfer decisions</text>
<text x="769" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">same latent structure · different surface form</text>
<text x="769" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">all foreground and background cost recorded</text>

<line x1="769" y1="188" x2="769" y2="251" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="786" y="226" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">paired evaluation</text>

<rect x="32" y="262" width="132" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="98" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Transfer</text>
<text x="98" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">≥ +5 points</text>
<text x="98" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">CI excludes zero</text>

<rect x="184" y="262" width="132" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="250" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Scope safety</text>
<text x="250" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">≤ +2-point harm</text>
<text x="250" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">non-inferiority</text>

<rect x="336" y="262" width="132" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="402" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Evidence</text>
<text x="402" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">precision ≥ .95</text>
<text x="402" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">counter recall ≥ .90</text>

<rect x="488" y="262" width="132" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="554" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Adaptation</text>
<text x="554" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">90% within</text>
<text x="554" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">2 contradictions</text>

<rect x="640" y="262" width="132" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="706" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Efficiency</text>
<text x="706" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">≥ +10% utility</text>
<text x="706" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">per total token</text>

<rect x="792" y="262" width="136" height="88" rx="14" fill="#F1F4F8" stroke="#B8C3D1" stroke-width="1.4"/>
<text x="860" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#162033">Governance</text>
<text x="860" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5B6575">100% invariants</text>
<text x="860" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">+ replication</text>

<line x1="98" y1="350" x2="98" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="250" y1="350" x2="250" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="402" y1="350" x2="402" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="554" y1="350" x2="554" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="706" y1="350" x2="706" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="860" y1="350" x2="860" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="98" y1="388" x2="860" y2="388" stroke="#8A98AA" stroke-width="1.8"/>
<line x1="479" y1="388" x2="479" y2="413" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="254" y="414" width="450" height="58" rx="16" fill="#E8F2FF" stroke="#8FA9C5" stroke-width="1.6"/>
<text x="479" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#162033">SUPPORTED only when every gate passes</text>
<text x="479" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5B6575">otherwise: partially supported · not supported · unsafe</text>
</svg>
