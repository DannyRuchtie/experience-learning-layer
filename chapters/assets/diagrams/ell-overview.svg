<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Where the Experience Learning Layer sits</title>
<desc id="desc">ELL turns consented experience into evidence-backed, revisable concepts, then uses observed outcomes to improve or challenge them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98AA"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#FBFCFE"/>
<line x1="190" y1="132.5" x2="270" y2="132.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="230" y="124.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">provenance</text>
<line x1="440" y1="132.5" x2="510" y2="132.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="475" y="124.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">evidence</text>
<line x1="680" y1="132.5" x2="770" y2="132.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725" y="124.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">concepts</text>
<line x1="855" y1="185" x2="715" y2="260" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="785" y="214.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">observe</text>
<line x1="715" y1="260" x2="355" y2="185" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="535" y="214.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">revise</text>
<rect x="20" y="80" width="170" height="105" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="105" y="120.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Consented experience</text>
<text x="105" y="144.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">events and episodes</text>
<rect x="270" y="80" width="170" height="105" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="355" y="120.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Experience layer</text>
<text x="355" y="144.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">preserve and associate</text>
<rect x="510" y="80" width="170" height="105" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="595" y="120.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Learning layer</text>
<text x="595" y="144.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">reflect and revise</text>
<rect x="770" y="80" width="170" height="105" rx="16" fill="#E6F6EE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="855" y="120.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Application</text>
<text x="855" y="144.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">scoped decisions</text>
<rect x="610" y="260" width="210" height="90" rx="16" fill="#FFF4D8" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="715" y="293" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Observed outcomes</text>
<text x="715" y="317" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">utility and correction</text>
</svg>
