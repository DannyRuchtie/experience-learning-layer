<rect x="205" y="80" width="155" height="90" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="282.5" y="113" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Reflection</text>
<text x="282.5" y="137" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">provisional meaning</text>
<rect x="395" y="80" width="155" height="90" rx="16" fill="#FFF4D8" stroke="#B8C3D1" stroke-width="1.5"/>
