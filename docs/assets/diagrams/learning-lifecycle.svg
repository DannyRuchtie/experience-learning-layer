<text x="490" y="327" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">correction or change</text>
<rect x="650" y="270" width="180" height="90" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="740" y="303" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">New version</text>
<text x="740" y="327" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">narrow, contest, retire</text>
