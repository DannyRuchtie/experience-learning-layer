<text x="875" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">feedback</text>
<line x1="580" y1="315" x2="650" y2="315" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="740" y1="270" x2="670" y2="170" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="705" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">supersedes</text>
<rect x="25" y="80" width="145" height="90" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
