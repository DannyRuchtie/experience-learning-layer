<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
<title id="title">Models interpret; deterministic code governs</title>
<desc id="desc">Generated interpretations enter quarantine. Schema validation and deterministic policy decide whether they are rejected, reviewed, or committed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98AA"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#FBFCFE"/>
<line x1="200" y1="112.5" x2="245" y2="112.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="415" y1="112.5" x2="460" y2="112.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="640" y1="112.5" x2="685" y2="112.5" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="775" y1="160" x2="860" y2="255" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="817.5" y="199.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">commit</text>
<line x1="775" y1="160" x2="497.5" y2="255" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="636.25" y="199.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">review</text>
<line x1="775" y1="160" x2="172.5" y2="255" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="473.75" y="199.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">reject</text>
<rect x="20" y="65" width="180" height="95" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="110" y="100.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Exact evidence</text>
<text x="110" y="124.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">source spans + provenance</text>
<rect x="245" y="65" width="170" height="95" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="330" y="100.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Model proposal</text>
<text x="330" y="124.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">typed candidate</text>
<rect x="460" y="65" width="180" height="95" rx="16" fill="#FFF4D8" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="550" y="100.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Candidate quarantine</text>
<text x="550" y="124.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">not retrievable</text>
<rect x="685" y="65" width="180" height="95" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="775" y="100.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Validation + policy</text>
<text x="775" y="124.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">deterministic checks</text>
<rect x="760" y="255" width="200" height="95" rx="16" fill="#E6F6EE" stroke="#B8C3D1" stroke-width="1.5"/>
