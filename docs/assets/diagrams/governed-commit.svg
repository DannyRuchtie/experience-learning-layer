<text x="497.5" y="314.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">supported but uncertain</text>
<rect x="90" y="255" width="165" height="95" rx="16" fill="#FDECEF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="172.5" y="290.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Reject</text>
<text x="172.5" y="314.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">unsupported or unsafe</text>
</svg>
