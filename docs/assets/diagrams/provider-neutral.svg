<text x="130" y="249.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">propose interpretations</text>
<rect x="320" y="165" width="320" height="150" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="480" y="216" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">ELL canonical core</text>
<text x="480" y="240" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">evidence · policy · lifecycle</text>
<text x="480" y="264" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">versioning · audit · retrieval</text>
