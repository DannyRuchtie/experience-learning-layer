<text x="830" y="249.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">rebuildable projections</text>
<rect x="330" y="385" width="300" height="85" rx="16" fill="#E6F6EE" stroke="#B8C3D1" stroke-width="1.5"/>
