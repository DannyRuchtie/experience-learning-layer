<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Canonical learning stays provider-neutral</title>
<desc id="desc">Clients, model providers, stores, and indexes are replaceable adapters. Canonical identity, evidence, policy, lifecycle, and audit remain inside ELL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98AA"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#FBFCFE"/>
<line x1="480" y1="110" x2="480" y2="165" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="129.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">episodes</text>
<line x1="235" y1="237.5" x2="320" y2="240" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="277.5" y="230.75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">candidates</text>
<line x1="725" y1="237.5" x2="640" y2="240" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="682.5" y="230.75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">retrieval</text>
<line x1="480" y1="315" x2="480" y2="385" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5B6575">scoped use</text>
<rect x="330" y="25" width="300" height="85" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="480" y="55.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Clients + connectors</text>
<text x="480" y="79.5" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">capture and consent</text>
<rect x="25" y="190" width="210" height="95" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
