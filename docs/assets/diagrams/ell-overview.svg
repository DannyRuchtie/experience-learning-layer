<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">Where the Experience Learning Layer sits</title>
<desc id="desc">ELL turns consented experience into evidence-backed, revisable concepts, then uses observed outcomes to improve or challenge them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98AA"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="#FBFCFE"/>
<line x1="220" y1="160" x2="270" y2="160" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="245" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">provenance</text>
<line x1="460" y1="160" x2="510" y2="160" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="485" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">evidence</text>
<line x1="700" y1="160" x2="750" y2="160" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">concepts</text>
<line x1="750" y1="160" x2="460" y2="160" stroke="#8A98AA" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="605" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5B6575">outcomes</text>
<rect x="30" y="105" width="190" height="110" rx="16" fill="#EEF2F6" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="125" y="148" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Consented experience</text>
<text x="125" y="172" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">events, episodes, outcomes</text>
<rect x="270" y="105" width="190" height="110" rx="16" fill="#E8F2FF" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="365" y="148" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Experience layer</text>
<text x="365" y="172" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">normalize, preserve, associate</text>
<rect x="510" y="105" width="190" height="110" rx="16" fill="#EEEAFE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="605" y="148" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Learning layer</text>
<text x="605" y="172" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">reflect, consolidate, revise</text>
<rect x="750" y="105" width="180" height="110" rx="16" fill="#E6F6EE" stroke="#B8C3D1" stroke-width="1.5"/>
<text x="840" y="148" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#162033">Application</text>
<text x="840" y="172" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#162033">scoped context and decisions</text>
</svg>
