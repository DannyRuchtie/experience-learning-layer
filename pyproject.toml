[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ell-paper"
version = "0.1.0"
description = "Experience Learning Layer paper and reproducible reading editions"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["paper"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "C4"]
ignore = ["UP045", "UP006", "UP035"]
